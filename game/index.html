<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Breaker</title>
<meta name="description" content="Breaker – ein klassisches Arcade-Brick-Breaker-Spiel, spielbar direkt im Browser und als iPhone-App installierbar.">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breaker">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05050c;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Helvetica, Arial, sans-serif;
    color: #f4f4f4;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9aa0b4;
    z-index: 5;
  }
  #hud b { color: #f4f4f4; font-weight: 700; margin-left: 6px; }
  #hud .stat { display: flex; align-items: baseline; }
  #canvasWrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background: rgba(5,5,12,0.86);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: 34px;
    margin: 0 0 6px;
    background: linear-gradient(90deg,#ff5da2,#ffd23f,#4fd1ff,#7c5cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.02em;
  }
  .overlay p {
    color: #9aa0b4;
    font-size: 15px;
    line-height: 1.5;
    max-width: 320px;
    margin: 4px 0 22px;
  }
  .overlay .big-score { font-size: 44px; font-weight: 800; margin: 4px 0 2px; }
  .overlay .sub-score { color: #9aa0b4; font-size: 13px; margin-bottom: 22px; }
  button.primary {
    appearance: none;
    border: none;
    background: linear-gradient(135deg,#ff5da2,#7c5cff);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    padding: 15px 40px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(124,92,255,0.35);
  }
  button.primary:active { transform: scale(0.96); }
  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: #5a6079;
  }
  #startHint {
    position: absolute;
    left: 0; right: 0;
    bottom: 14%;
    text-align: center;
    font-size: 13px;
    color: #6a7189;
    letter-spacing: 0.04em;
    pointer-events: none;
    transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat">SCORE<b id="scoreVal">0</b></div>
    <div class="stat">LEVEL<b id="levelVal">1</b></div>
    <div class="stat">BEST<b id="bestVal">0</b></div>
    <div class="stat" id="livesStat">LEBEN<b id="livesVal">3</b></div>
  </div>
  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="startHint">Tippen &amp; ziehen, um den Schläger zu bewegen</div>

    <div id="startOverlay" class="overlay">
      <h1>BREAKER</h1>
      <p>Ziehe den Schläger mit dem Finger. Zerstöre alle Blöcke, ohne den Ball fallen zu lassen.</p>
      <button class="primary" id="startBtn">Spiel starten</button>
      <div class="hint">Inspiriert vom klassischen Arcade-Automaten aus den 80ern</div>
    </div>

    <div id="loseOverlay" class="overlay hidden">
      <div style="font-size:13px;letter-spacing:0.1em;color:#9aa0b4;">GAME OVER</div>
      <div class="big-score" id="finalScore">0</div>
      <div class="sub-score" id="finalSub">Punkte</div>
      <button class="primary" id="retryBtn">Nochmal spielen</button>
    </div>

    <div id="winOverlay" class="overlay hidden">
      <div style="font-size:13px;letter-spacing:0.1em;color:#9aa0b4;">LEVEL GESCHAFFT</div>
      <div class="big-score" id="winScore">0</div>
      <div class="sub-score" id="winSub">Punkte insgesamt</div>
      <button class="primary" id="nextBtn">Nächstes Level</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("canvasWrap");

  var scoreEl = document.getElementById("scoreVal");
  var levelEl = document.getElementById("levelVal");
  var bestEl = document.getElementById("bestVal");
  var livesEl = document.getElementById("livesVal");
  var startHint = document.getElementById("startHint");

  var startOverlay = document.getElementById("startOverlay");
  var loseOverlay = document.getElementById("loseOverlay");
  var winOverlay = document.getElementById("winOverlay");
  var finalScoreEl = document.getElementById("finalScore");
  var winScoreEl = document.getElementById("winScore");

  var DPR = Math.min(window.devicePixelRatio || 1, 3);
  var W = 0, H = 0;

  var ROW_COLORS = ["#ff5da2", "#ffd23f", "#4fd1ff", "#7c5cff", "#5cffb0", "#ff8a5c"];

  var state = {
    running: false,
    level: 1,
    score: 0,
    lives: 3,
    best: parseInt(localStorage.getItem("breaker_best") || "0", 10)
  };
  bestEl.textContent = state.best;

  var paddle = { x: 0, y: 0, w: 0, h: 0, targetX: 0 };
  var ball = { x: 0, y: 0, r: 0, vx: 0, vy: 0, speed: 0, launched: false };
  var bricks = [];
  var particles = [];

  function resize() {
    var rect = wrap.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    paddle.w = Math.max(70, W * 0.24);
    paddle.h = Math.max(12, H * 0.016);
    paddle.y = H - Math.max(40, H * 0.08);
    if (paddle.x === 0) paddle.x = W / 2 - paddle.w / 2;
    paddle.x = Math.min(Math.max(paddle.x, 0), W - paddle.w);

    ball.r = Math.max(6, W * 0.014);

    layoutBricks();
    if (!state.running) placeBallOnPaddle();
  }

  function layoutBricks() {
    var cols = 8;
    var rows = 5 + Math.min(state.level - 1, 4);
    var padTop = H * 0.10;
    var padSide = W * 0.04;
    var gap = W * 0.012;
    var availW = W - padSide * 2;
    var brickW = (availW - gap * (cols - 1)) / cols;
    var brickH = Math.max(14, H * 0.028);

    var old = bricks;
    bricks = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var alive = true;
        if (old.length) {
          var prev = old[r * cols + c];
          if (prev && !prev.alive) alive = false;
          if (!prev) alive = true;
        }
        bricks.push({
          x: padSide + c * (brickW + gap),
          y: padTop + r * (brickH + gap),
          w: brickW,
          h: brickH,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: alive,
          hp: 1
        });
      }
    }
  }

  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;
    ball.launched = false;
  }

  function resetBallSpeed() {
    ball.speed = Math.max(5, H * 0.0085) + (state.level - 1) * 0.4;
  }

  function launchBall() {
    if (ball.launched) return;
    ball.launched = true;
    var angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
  }

  function newLevelSetup(keepScore) {
    layoutBricks();
    resetBallSpeed();
    placeBallOnPaddle();
  }

  function startGame() {
    state.level = 1;
    state.score = 0;
    state.lives = 3;
    updateHud();
    startOverlay.classList.add("hidden");
    loseOverlay.classList.add("hidden");
    winOverlay.classList.add("hidden");
    newLevelSetup();
    state.running = true;
    startHint.style.opacity = "1";
  }

  function nextLevel() {
    state.level += 1;
    winOverlay.classList.add("hidden");
    updateHud();
    newLevelSetup();
    state.running = true;
  }

  function loseLife() {
    state.lives -= 1;
    updateHud();
    if (state.lives <= 0) {
      endGame();
    } else {
      placeBallOnPaddle();
    }
  }

  function endGame() {
    state.running = false;
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem("breaker_best", String(state.best));
      bestEl.textContent = state.best;
    }
    finalScoreEl.textContent = state.score;
    loseOverlay.classList.remove("hidden");
  }

  function levelComplete() {
    state.running = false;
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem("breaker_best", String(state.best));
      bestEl.textContent = state.best;
    }
    winScoreEl.textContent = state.score;
    winOverlay.classList.remove("hidden");
  }

  function updateHud() {
    scoreEl.textContent = state.score;
    levelEl.textContent = state.level;
    livesEl.textContent = state.lives;
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i < 6; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 1,
        color: color
      });
    }
  }

  // --- input (pointer-based, drag to move paddle) ---
  var activePointerId = null;

  function pointerToLocalX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return clientX - rect.left;
  }

  function onPointerDown(e) {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    var x = pointerToLocalX(e.clientX);
    paddle.targetX = x - paddle.w / 2;
    if (state.running && !ball.launched) launchBall();
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    startHint.style.opacity = "0";
  }

  function onPointerMove(e) {
    if (activePointerId !== e.pointerId) return;
    var x = pointerToLocalX(e.clientX);
    paddle.targetX = x - paddle.w / 2;
  }

  function onPointerUp(e) {
    if (activePointerId !== e.pointerId) return;
    activePointerId = null;
  }

  canvas.addEventListener("pointerdown", onPointerDown, { passive: true });
  canvas.addEventListener("pointermove", onPointerMove, { passive: true });
  canvas.addEventListener("pointerup", onPointerUp, { passive: true });
  canvas.addEventListener("pointercancel", onPointerUp, { passive: true });

  document.body.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);
  document.getElementById("nextBtn").addEventListener("click", nextLevel);

  // --- physics / update ---
  function update() {
    // smooth paddle follow
    var dx = paddle.targetX - paddle.x;
    paddle.x += dx * 0.35;
    paddle.x = Math.min(Math.max(paddle.x, 0), W - paddle.w);

    if (!state.running) return;

    if (!ball.launched) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
      return;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

    // paddle collision
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y + ball.r <= paddle.y + paddle.h + 8 &&
        ball.x >= paddle.x - ball.r &&
        ball.x <= paddle.x + paddle.w + ball.r) {
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      hit = Math.max(-1, Math.min(1, hit));
      var angle = hit * (Math.PI / 3) - Math.PI / 2;
      var speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.cos(angle) * speed;
      ball.vy = Math.sin(angle) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // brick collision
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        b.alive = false;
        state.score += 10;
        updateHud();
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);

        var overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        var overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.vx *= -1;
        } else {
          ball.vy *= -1;
        }
        break;
      }
    }

    if (ball.y - ball.r > H) {
      loseLife();
    }

    var remaining = bricks.some(function (b) { return b.alive; });
    if (!remaining) {
      levelComplete();
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.04;
      if (pt.life <= 0) particles.splice(p, 1);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#0b0b18");
    grad.addColorStop(1, "#05050c");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, Math.min(4, b.h * 0.25));
      ctx.fill();
    }

    // particles
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(pt.life, 0);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // paddle
    ctx.fillStyle = "#f4f4f4";
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, paddle.h / 2);
    ctx.fill();

    // ball
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);

  // prevent iOS bounce/zoom gestures
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
